<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Player</title>
</head>
<body>

    <!-- Main Heading -->
    <h1 align="center">Multimedia Player</h1>

    <!-- Audio Section -->
    <h3>Audio Section</h3>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <br><br>

    <!-- Video Section (YouTube Embed) -->
    <h3>Video Section</h3>
    <iframe width="320" height="180" src="https://www.youtube.com/embed/vGoiqOA6O2g" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

</body>
</html>
