<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 15 - Form Elements</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" size="35"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" size="35"><br><br>

            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="pwd" size="35"><br><br>

            Gender:
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            Hobbies:
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="coding" name="hobbies" value="coding">
            <label for="coding">Coding</label><br><br>

            <label for="dob">DOB:</label>
            <input type="text" id="dob" name="dob" size="35">
        </fieldset>
    </form>
</body>
</html>
